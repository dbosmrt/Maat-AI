name: Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Run Tests
      env:
        # Mocking the required env vars for tests to pass without real keys
        NVIDIA_NIM_KEY: "mock-key-for-testing-only"
      run: |
        PYTHONPATH=server pytest test/ -v --cov=server --cov-report=term-missing
