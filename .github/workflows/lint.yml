name: Lint & Type Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint mypy flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Run Pylint
      run: |
        # Enforce 10/10 score. We use fail-under=10.0 to ensure strict compliance.
        pylint --fail-under=10.0 server/
        
    - name: Run Flake8 (PEP 8)
      run: |
        flake8 server/ --count --show-source --statistics
        
    - name: Run MyPy (Type Checking)
      run: |
        mypy server/ --ignore-missing-imports
