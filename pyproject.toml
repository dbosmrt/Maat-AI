[build-system]
requires = ["uv-build >= 0.11.23, <0.12.0"]
build-backend = "uv_build"

[project]
name = "maat-ai"
version = 0.0.1
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.68.0",
    "uvicorn>=0.15.0",
    "langchain_pinecone>=0.2.13",
    "pinecone-client>=6.0.0",
    "openai>=0.27.0",
    "langchain-nvidia-ai-endpoints==1.4.1",
    "langgraph>=1.1.10",
    "langchain>=1.2.17",
    "langchain-core>=1.3.3",
    "langchain-community>=0.4.0",
    "langchain-docling>=0.1.0",
    "chromadb>=0.4.0",
    "langchain-chroma>=0.1.0",
    "langchain-text-splitters>=0.2.0",
    "duckduckgo-search>=6.0.0",
    "pydantic>=1.8.0",
    "python-multipart>=0.0.5",
]

maintainers = [
    {name = "Deepanshu Bhatt", email="deepanshu.2006bhatt@gmail.com"},
]
readme = "README.md"

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
]

[project.urls]
Repository = "https://github.com/dbosmrt/Ma-at-"

