[build-system]
requires = ["uv-build >= 0.11.23, <0.12.0"]
build-backend = "uv_build"

[project]
name = "maat-ai"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    # Core API Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # NVIDIA NIM / OpenAI-compatible clients
    "openai>=1.109.1",
    "langchain-nvidia-ai-endpoints==1.4.1",

    # LangChain Ecosystem - pinned for stability
    "langgraph>=1.2.9,<2.0.0",
    "langchain>=1.3.14,<2.0.0",
    "langchain-core>=1.5.1,<2.0.0",
    "langchain-community>=0.4.2,<1.0.0",

    "langchain-docling>=2.0.0",

    # Vector store: Pinecone
    "pinecone>=7.3.0",
    "langchain-pinecone>=0.2.13",
    "langchain-openai>=1.0.0",

    "langchain-text-splitters>=1.1.2",

    # Web Search
    "duckduckgo-search>=7.1.0",

    # Validation & Serialization
    "pydantic>=2.11.1,<3.0.0",
    "pydantic-settings>=2.10.1",
    "python-multipart>=0.0.9",

    # Token counting for history truncation
    "tiktoken>=0.8.0",

    # Configuration
    "python-dotenv>=1.0.1",

    # Logging
    "structlog>=24.1.0",

    # Database - MongoDB with Motor (async) and Beanie (ODM)
    "motor>=3.7.0,<4.0.0",
    "beanie>=2.0.0,<3.0.0",
    "pymongo>=4.10,<5.0",

    # Redis for rate limiting, token blacklist, sessions
    "redis>=5.0.0,<6.0.0",

    # Authentication & Security
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=42.0.8",

    # Rate Limiting
    "slowapi>=0.1.9",

    # Async HTTP client for inter-service communication
    "httpx>=0.27.2,<0.29",

    # Observability - LangSmith
    "langsmith>=0.10.14",
]

maintainers = [
    {name = "Deepanshu Bhatt", email="deepanshu.2006bhatt@gmail.com"},
]
readme = "README.md"

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
]

[project.urls]
Repository = "https://github.com/dbosmrt/Ma-at-"

[tool.uv]
package = false

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.2",
]
lint = [
    "pylint>=3.0.0",
    "mypy>=1.12.0",
    "flake8>=7.1.0",
]